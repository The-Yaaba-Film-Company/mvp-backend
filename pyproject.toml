[project]
name = "mpcampo"
version = "0.1.0"
description = "Screenplay editor backend (FastAPI + Supabase Postgres)"
requires-python = ">=3.12"
dependencies = [
    "google-genai",
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "psycopg2",
    "asyncpg",
    "alembic",
    "pydantic",
    "pydantic-settings",
    "email-validator",
    "argon2-cffi",
    "openai",
    "sentry-sdk[fastapi]",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "httpx",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--tb=short -q --cov=app --cov-report=term"
markers = ["epic: marks an epic's tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
ignore = [
    "B008",  # FastAPI Depends() in argument defaults is the expected pattern
]

[tool.coverage.run]
source = ["app"]
concurrency = ["thread", "greenlet"]
branch = true

[tool.coverage.report]
fail_under = 80
