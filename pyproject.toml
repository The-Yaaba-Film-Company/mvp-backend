[project]
name = "mpcampo"
version = "0.1.0"
description = "Screenplay editor backend (FastAPI + Supabase Postgres)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "email-validator>=2.1",
    "argon2-cffi>=23.1",
    "openai>=1.0",
    "sentry-sdk[fastapi]>=2.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--tb=short -q --cov=app --cov-report=term"
markers = ["epic: marks an epic's tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
ignore = [
    "B008",  # FastAPI Depends() in argument defaults is the expected pattern
]

[tool.coverage.run]
source = ["app"]
concurrency = ["thread", "greenlet"]
branch = true

[tool.coverage.report]
fail_under = 80